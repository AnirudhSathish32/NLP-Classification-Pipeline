# bert_config.yaml
# -----------------
# All tunable hyperparameters for BERT fine-tuning.
#
# Connects to:
#   bert_classifier.py  — loads this file via load_bert_config()
#   bert_dataset.py     — consumes max_length, batch_size
#   MLflow              — all values logged as params at run start
 
# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model_name: "bert-base-uncased"
 
# ---------------------------------------------------------------------------
# Tokenisation
# ---------------------------------------------------------------------------
max_length: 256          # 256 covers ~95% of IMDB reviews and fits on 6GB+ VRAM
 
# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
num_epochs: 3
 
batch_size: 16           # Safe for 6GB+ VRAM at max_length=256
 
learning_rate: 2.0e-5
 
weight_decay: 0.01
 
warmup_steps: 500
 
max_grad_norm: 1.0
 
# ---------------------------------------------------------------------------
# Data splits
# ---------------------------------------------------------------------------
val_split: 0.1
 
random_seed: 42
 
# ---------------------------------------------------------------------------
# Checkpointing
# ---------------------------------------------------------------------------
checkpoint_dir: "models/bert_checkpoints"
checkpoint_metric: "val_roc_auc"
 
# ---------------------------------------------------------------------------
# ONNX export
# ---------------------------------------------------------------------------
onnx_export: true
onnx_output_dir: "model_store/bert"
onnx_opset_version: 17
